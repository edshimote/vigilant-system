<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Acesso Restrito</title>
  <script>
    // adm.html agora é um honeypot — redireciona para index
    // O painel real está em painel-lumie-interno.html
    (function() {
      try {
        var u = JSON.parse(localStorage.getItem('lm_user') || 'null');
        if (u && u.isAdm && u.active && u.email && u.email.toLowerCase() === 'suporte@lumie.com') {
          // ADM legítimo: redireciona para o painel real
          window.location.replace('painel-lumie-interno.html');
        } else {
          // Qualquer outro: vai para index
          window.location.replace('index.html');
        }
      } catch(e) {
        window.location.replace('index.html');
      }
    })();
  </script>
</head>
<body></body>
</html>
